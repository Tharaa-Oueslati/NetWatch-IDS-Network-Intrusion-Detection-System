name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install libpcap for Scapy
          sudo apt-get install -y libpcap-dev

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Check rule syntax
        run: python -c "
import json
with open('rules/default_rules.json') as f:
    data = json.load(f)
rules = data['rules']
print(f'✓ {len(rules)} rules loaded successfully')
for r in rules:
    assert 'id' in r, f'Rule missing id: {r}'
    assert 'severity' in r
    assert 'mitre_technique' in r
print('✓ All rules have required fields')
"
